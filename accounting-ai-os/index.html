<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Accounting OS - Futuristic Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Courier New', Courier, monospace; }
        .glass { background: rgba(0, 242, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.3); }
        .neon-text { text-shadow: 0 0 10px #00f2ff; }
        .btn-neon { transition: all 0.3s; border: 1px solid #00f2ff; }
        .btn-neon:hover { background: #00f2ff; color: black; box-shadow: 0 0 20px #00f2ff; }
    </style>
</head>
<body>
    <!-- UI Overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-8">
        <header class="flex justify-between items-center pointer-events-auto">
            <div class="glass p-4 rounded-br-3xl rounded-tl-xl text-cyan-400">
                <h1 class="text-2xl font-bold tracking-tighter flex items-center gap-2 neon-text">
                    <span>💠</span> ACCOUNTING-AI OS <span class="text-xs bg-cyan-500 text-black px-2 py-1 rounded">v1.0.0-STABLE</span>
                </h1>
            </div>
            <div class="flex gap-4">
                <button class="p-3 glass rounded-full text-cyan-400 hover:bg-cyan-500 hover:text-black transition-all">⚙️</button>
            </div>
        </header>

        <div class="flex justify-between items-end h-full">
            <!-- PC Control Panel -->
            <div class="pointer-events-auto space-y-4 glass p-6 rounded-tr-3xl rounded-bl-xl text-cyan-400">
                <h3 class="text-xs font-bold uppercase opacity-50 mb-4">Contrôle PC Distant</h3>
                <button onclick="execute('open_calculator')" class="w-full flex items-center gap-3 p-3 bg-cyan-500/10 btn-neon rounded-lg text-left">
                    <span>🖩</span> Launch Calculator
                </button>
                <button onclick="execute('open_notepad')" class="w-full flex items-center gap-3 p-3 bg-cyan-500/10 btn-neon rounded-lg text-left">
                    <span>📝</span> Open Notepad
                </button>
                <button onclick="execute('open_explorer')" class="w-full flex items-center gap-3 p-3 bg-cyan-500/10 btn-neon rounded-lg text-left">
                    <span>📁</span> File Explorer
                </button>
            </div>

            <!-- AI Status Panel -->
            <div class="pointer-events-auto space-y-4 glass p-6 rounded-tl-3xl rounded-br-xl text-cyan-400">
                <h3 class="text-xs font-bold uppercase opacity-50 mb-4">Statut des Agents IA</h3>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 text-sm">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span>Collecteur: Prêt</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm">
                        <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                        <span>Auditeur: Analyse...</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm">
                        <div class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></div>
                        <span>Analyste: En attente</span>
                    </div>
                </div>
                <div class="mt-6 p-4 bg-black/40 border border-cyan-500/20 rounded-lg">
                    <p class="text-[10px] opacity-60 mb-2">LOG SYSTÈME</p>
                    <p id="log" class="text-xs italic">"Système initialisé. En attente d'ordres..."</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 3D Engine (Three.js) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00f2ff, 2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Futuristic Core (Distorted Sphere)
        const geometry = new THREE.IcosahedronGeometry(1, 15);
        const material = new THREE.MeshStandardMaterial({
            color: 0x00f2ff,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        camera.position.z = 4;

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.x += 0.005;
            core.rotation.y += 0.005;
            // Simple distortion effect
            const time = Date.now() * 0.001;
            core.scale.setScalar(1 + Math.sin(time) * 0.1);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- API Logic ---
        async function execute(action) {
            const log = document.getElementById('log');
            log.innerText = `Envoi de l'ordre : ${action}...`;
            try {
                const response = await fetch('http://localhost:8000/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command_id: 'web_user', action: action })
                });
                const data = await response.json();
                log.innerText = `Réponse : ${data.status === 'command_sent' ? 'Ordre exécuté ✓' : 'Erreur ' + data.message}`;
            } catch (e) {
                log.innerText = `Erreur de connexion au serveur backend.`;
            }
        }
    </script>
</body>
</html>
